[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/**/__init__.py",
    "src/management/init_db.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
# Overall fail-under floor; matches the addopts gate in pytest.ini so a
# direct `coverage report` and `pytest --cov` enforce the same threshold.
# Temporarily lowered to 70 while we backfill tests toward the 85 target
# (see docs/testing.md coverage roadmap). Per-package floors (core 90%,
# api_log 95%, api/service/repository 80%) are enforced in CI via separate
# `coverage report --include=... --fail-under=N` steps — see
# .github/workflows/test.yml.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.12"

# Third-party packages that ship no type information (no py.typed / no stubs
# on PyPI). Silence the import-untyped errors here rather than scattering
# per-line ignores at each import site.
[[tool.mypy.overrides]]
module = ["celery.*", "authlib.*"]
ignore_missing_imports = true
